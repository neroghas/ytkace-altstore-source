name: Update YTKACE source

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ytkace-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate and validate source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python update_source.py
          python update_source.py --check --check-links

      - name: Commit source changes
        run: |
          if git diff --quiet -- source.json; then
            echo "Source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "Update YTKACE source"
          git push
